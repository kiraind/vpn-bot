name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install system tools used by tests
        run: sudo apt-get update && sudo apt-get install -y nftables age
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
